services:
  - type: web
    name: ss-study-centre
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: ss-study-centre-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_ROOT
        value: /opt/render/project/src/storage
      - key: ADMIN_PASSWORD
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
